name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version is taken from the root package.json "packageManager" field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client is generated by @repo/db's postinstall hook during
      # `pnpm install`; this is a belt-and-suspenders explicit regeneration.
      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit + wiring tests run here. The real-Upstash integration test
      # self-skips because no UPSTASH_* secrets are present in CI.
      - name: Tests
        run: pnpm test
